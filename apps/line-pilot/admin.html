<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アイドル駅伝・配信テスト</title>
<style>
:root{font-family:system-ui,"Yu Gothic",sans-serif;color:#24312f;background:#f3f6f5}*{box-sizing:border-box}body{margin:0}main{max-width:1000px;margin:auto;padding:32px 20px}h1{font-size:28px;margin:8px 0}h2{font-size:19px;margin:0 0 16px}.eyebrow{color:#477c70;letter-spacing:.1em;font-size:12px;font-weight:bold}.sub{color:#61746e;line-height:1.8}.card{background:#fff;border:1px solid #dfe8e4;border-radius:16px;padding:24px;margin-top:20px}.badge{display:inline-block;border-radius:20px;background:#e4f3eb;color:#25664b;padding:6px 12px;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}label{display:block;margin:14px 0 7px;font-weight:600;font-size:14px}input,select,textarea{width:100%;border:1px solid #c8d7d0;border-radius:8px;padding:11px;font:inherit;background:white}textarea{min-height:160px;resize:vertical}button{border:0;border-radius:8px;padding:11px 16px;background:#246f56;color:white;font:inherit;cursor:pointer}button.secondary{background:#e9efec;color:#304e42}button:disabled{opacity:.45;cursor:default}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}.group{display:grid;grid-template-columns:1fr 140px auto;gap:8px;margin-bottom:12px}.group input,.group select{font-size:14px}.note{font-size:13px;line-height:1.7;color:#667c73}.empty{padding:20px;background:#f6f8f7;border-radius:8px}.preview{white-space:pre-wrap;padding:18px;background:#edf7f1;border-radius:10px;line-height:1.8;overflow-wrap:anywhere}.history{padding:14px 0;border-bottom:1px solid #e7eeea}.history p{margin:6px 0;white-space:pre-wrap;overflow-wrap:anywhere}.status{min-height:24px;margin-top:16px;color:#246f56}.error{color:#ae3434}@media(max-width:750px){.grid{grid-template-columns:1fr}.group{grid-template-columns:1fr}.card{padding:18px}}
</style></head><body><main>
<div class="eyebrow">IDOL EKIDEN / DELIVERY PILOT</div><h1>全体とチームに、送り分ける。</h1><p class="sub">送り先と本文を確認して、配信の流れを試せます。</p><span id="mode" class="badge">接続状態を確認中</span><div id="status" class="status" role="status"></div>
<section class="card"><h2>1. グループを登録</h2><p class="note">LINEから接続されたグループに、名前と用途を付けます。初めてなら練習用グループで操作を試してください。</p><div id="groups"></div><div class="actions"><button id="demo" class="secondary">練習用の全体・チームA・Bを追加</button><button id="refresh" class="secondary">接続状況を更新</button></div></section>
<div class="grid"><section class="card"><h2>2. お知らせを作成</h2><label for="target">送り先</label><select id="target"></select><label for="template">例文</label><select id="template"><option value="">選んで入力</option><option value="all">全体への集合連絡</option><option value="reward">チーム限定の報酬連絡</option><option value="ad">全体への広告</option></select><label for="text">本文</label><textarea id="text" maxlength="5000" placeholder="配信したい内容を入力"></textarea><div class="actions"><button id="preview">プレビューする</button></div></section>
<section class="card"><h2>3. 内容と送り先を確認</h2><p id="destinations" class="note">プレビューすると、実際の送り先が表示されます。</p><div id="previewText" class="preview">ここに本文が表示されます。</div><div class="actions"><button id="practice" disabled class="secondary">練習として記録</button><button id="send" disabled>LINEに送信</button></div><p class="note">練習として記録した内容はLINEへ送信されません。「LINEに送信」は接続設定後に使えます。</p></section></div>
<section class="card"><h2>配信履歴</h2><div id="history"></div></section>
</main><script>
let state, preview;
const $ = id => document.getElementById(id);
function message(text, error=false){$('status').textContent=text;$('status').className='status'+(error?' error':'');}
async function api(route, body){const response=await fetch('/api/'+route,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json','X-Gaia-Admin':'1'},body:JSON.stringify(body)});const data=await response.json();if(!response.ok)throw new Error(data.error);return data;}
function element(tag,text){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;return el;}
function clearPreview(){preview=null;$('practice').disabled=true;$('send').disabled=true;$('destinations').textContent='送り先や本文の変更後は、もう一度プレビューしてください。';$('previewText').textContent='ここに本文が表示されます。';}
async function refresh(){state=await api('state');$('mode').textContent=state.liveReady?'LINE接続モード':state.liveRequested?'接続設定が未完了':'配信練習モード';$('demo').disabled=state.liveRequested;
 $('groups').replaceChildren();if(!state.groups.length)$('groups').append(element('p','まだグループがありません。練習用グループを追加するか、LINEの接続設定を行ってください。'));
 for(const g of state.groups){const row=element('div');row.className='group';const name=element('input');name.value=g.name;name.maxLength=80;name.setAttribute('aria-label','グループ名');const role=element('select');role.setAttribute('aria-label','用途');for(const [v,t]of[['unassigned','未割り当て'],['all','全体'],['team','チーム']]){const o=element('option',t);o.value=v;role.append(o);}role.value=g.role;const save=element('button',g.active?'保存':'退出済み');save.disabled=!g.active;save.onclick=()=>run(async()=>{await api('group',{id:g.id,name:name.value,role:role.value});clearPreview();await refresh();message('グループ設定を保存しました。');});row.append(name,role,save);$('groups').append(row);}
 const old=$('target').value;$('target').replaceChildren();for(const[v,t]of[['all','全体グループ'],['teams','全チームの個別グループ']]){const o=element('option',t);o.value=v;$('target').append(o);}for(const g of state.groups.filter(g=>g.active&&g.role==='team')){const o=element('option',g.name);o.value=g.id;$('target').append(o);}if([...$('target').options].some(o=>o.value===old))$('target').value=old;
 $('history').replaceChildren();if(!state.history.length)$('history').append(element('p','まだ履歴はありません。'));const labels={practice:'練習のみ',accepted:'LINE受付済み（到着はLINEで確認）',pending:'処理中', 'check-required':'要確認'};for(const job of state.history.slice(0,30)){const div=element('div');div.className='history';div.append(element('small',new Date(job.at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'})+' / '+(job.mode==='live'?'LINE送信':'練習')),element('p',job.text));for(const result of job.results)div.append(element('p',result.name+'：'+labels[result.status]+(result.error?' — '+result.error:'')));$('history').append(div);}
}
async function run(fn){try{await fn();}catch(e){message(e.message,true);}}
$('demo').onclick=()=>run(async()=>{await api('demo',{});clearPreview();await refresh();message('練習用グループを追加しました。');});$('refresh').onclick=()=>run(async()=>{clearPreview();await refresh();message('接続状況を更新しました。');});
$('target').onchange=clearPreview;$('text').oninput=clearPreview;
$('template').onchange=()=>{const examples={all:'【運営連絡】\nライブ開始15分前です。全チーム、ステージ前に集合してください。',reward:'【チーム限定・報酬】\nミッション成功！ 推し活資金を獲得しました。残高はダッシュボードで確認できます。',ad:'【アイドル広告】\nチームAのデビューライブ、まもなく開幕！\n最後の決めポーズにご注目ください。'};if(examples[$('template').value]){$('text').value=examples[$('template').value];clearPreview();}};
$('preview').onclick=()=>run(async()=>{clearPreview();const v=$('target').value;preview=await api('preview',{selection:v==='all'||v==='teams'?{kind:v}:{kind:'group',id:v},text:$('text').value});$('destinations').textContent='送り先：'+preview.targets.map(g=>g.name).join('、');$('previewText').textContent=preview.text;$('practice').disabled=false;$('send').disabled=!state.liveReady;message('送り先と本文を確認してください。');});
async function send(actual){if(!preview)return;const id=preview.id;$('practice').disabled=true;$('send').disabled=true;preview=null;try{const job=await api('send',{previewId:id,actual});await refresh();message(actual?(job.results.every(r=>r.status==='accepted')?'LINEが受け付けました。実際のグループで到着を確認してください。':'一部の送信は確認が必要です。履歴を確認してください。'):'練習として記録しました。LINEには送信していません。');}catch(e){await refresh();throw e;}}
$('practice').onclick=()=>run(()=>send(false));$('send').onclick=()=>run(()=>send(true));run(refresh);
</script></body></html>
