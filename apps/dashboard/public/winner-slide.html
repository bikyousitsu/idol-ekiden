<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アイドル駅伝／優勝発表</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#020610;font-family:'Noto Sans JP','Yu Gothic',sans-serif;color:#fff} .slide{position:fixed;left:50%;top:calc(50% - 35px);width:1280px;height:720px;transform-origin:center;background:#050b19 url('./winner-background-v1.png') center/cover no-repeat;text-align:center}#award{position:absolute;left:130px;top:130px;width:1020px;margin:0;font-size:42px;font-weight:700;letter-spacing:.16em;color:#f9db91}#winner{position:absolute;left:110px;top:238px;width:1060px;height:250px;display:flex;flex-direction:column;justify-content:center;gap:8px;font-size:108px;line-height:1.12;font-weight:900;margin:0;overflow-wrap:anywhere;text-shadow:0 4px 24px #020610}#winner span{display:block}#winner.joint-many{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:12px 28px}#winner.joint-many span{display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;overflow-wrap:anywhere}#fans{position:absolute;top:502px;left:150px;width:980px;font-size:30px;margin:0;color:#eee5cc}#debut{position:absolute;top:580px;left:130px;width:1020px;font-size:44px;font-weight:700;letter-spacing:.08em;margin:0;color:#f9db91}.revealed #winner{animation:appear .85s ease-out}.revealed #fans,.revealed #debut{animation:appear 1.25s ease-out}#sample{position:absolute;left:0;top:24px;width:100%;font-size:24px;color:#ffb5d0}#controls{position:fixed;bottom:0;left:0;width:100%;min-height:66px;display:flex;align-items:center;justify-content:center;gap:12px;background:#10172a;padding:10px;font-size:14px}button{font:inherit;border:1px solid #5f6472;background:#1e2940;color:#fff;padding:9px 14px;cursor:pointer}button:disabled{opacity:.4;cursor:default}#reveal{background:#ecd093;color:#10172a;border:0;font-weight:700}#status{max-width:560px;margin:0;color:#cdd5e8} :fullscreen .slide{top:50%}:fullscreen #controls{display:none}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}@page{size:338.67mm 190.5mm;margin:0}@media print{button{display:none}#controls{display:none}.slide{position:absolute;left:0;top:0;transform:none!important;width:338.67mm;height:190.5mm;print-color-adjust:exact}}
</style></head><body><section class="slide" id="stage" aria-label="優勝発表スライド"><p id="sample" hidden>デザイン確認用サンプル</p><h1 id="award">レコード大賞</h1><div id="winner">優勝発表</div><p id="fans"></p><p id="debut"></p></section><div id="controls"><button id="reveal" disabled>優勝を発表</button><button id="fullscreen">全画面（F）</button><button id="refresh">更新（R）</button><button id="reset">発表前に戻す</button><p id="status" role="status">本番の確定結果を確認中</p></div><script type="module" src="./winner-slide.mjs"></script></body></html>
